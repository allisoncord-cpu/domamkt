<title>Legião Legatus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral escura da marca + área principal em grade; vira barra superior rolável no celular.
   Mundo visual: os quadros da Legião (moldura de carvalho, painel em pedra preciosa, letras em ouro). */
:root {
  --bg: #edebe7;
  --surface: #ffffff;
  --surface-2: #f6f4f1;
  --ink: #17191c;
  --muted: #646a72;
  --line: #dcd8d1;
  --brand: #0f1d18;
  --brand-ink: #ece7dc;
  --gold: #9c7420;
  --gold-soft: #f4ead3;
  --gold-hi: #f1d58c;
  --up: #12804c;
  --up-soft: #e1f3e9;
  --down: #c13d2c;
  --chart-line: #0f4a35;
  --chart-fill: rgba(15,74,53,.10);
  --chart-grid: #e6e2dc;
  --f-serif: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --f-caps: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1110; --surface: #151a19; --surface-2: #1a201f; --ink: #ebe8e2; --muted: #9aa19e; --line: #28302e;
    --brand: #0a1411; --gold: #e0b95c; --gold-soft: #33291a; --up: #3ccf88; --up-soft: #12291e; --down: #ff7a66;
    --chart-line: #e0b95c; --chart-fill: rgba(224,185,92,.13); --chart-grid: #232b29;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1110; --surface: #151a19; --surface-2: #1a201f; --ink: #ebe8e2; --muted: #9aa19e; --line: #28302e;
  --brand: #0a1411; --gold: #e0b95c; --gold-soft: #33291a; --up: #3ccf88; --up-soft: #12291e; --down: #ff7a66;
  --chart-line: #e0b95c; --chart-fill: rgba(224,185,92,.13); --chart-grid: #232b29;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-family: var(--f-serif); font-weight: 600; }
h2, h3 { font-family: var(--f-caps); font-weight: 600; letter-spacing: .01em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
.eyebrow { font-family: var(--f-caps); font-size: .68rem; text-transform: uppercase; letter-spacing: .16em; font-weight: 600; color: var(--muted); }

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100vh; }
.side { background: var(--brand); color: var(--brand-ink); padding: 28px 16px 20px; display: flex; flex-direction: column; gap: 28px; position: sticky; top: 0; height: 100vh; }
.brand { padding-inline: 10px; display: flex; align-items: center; gap: 12px; }
.brand svg { width: 34px; height: auto; flex: none; }
.brand div { display: flex; flex-direction: column; gap: 2px; }
.brand b { font-family: var(--f-caps); font-weight: 500; letter-spacing: .3em; font-size: 1rem; color: var(--gold-hi); line-height: 1.1; }
.brand span { font-family: var(--f-caps); font-size: .58rem; letter-spacing: .38em; opacity: .65; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { color: var(--brand-ink); text-decoration: none; padding: 10px 12px; border-radius: 10px; font-weight: 600; display: flex; align-items: center; gap: 10px; opacity: .74; white-space: nowrap; }
.nav a:hover { opacity: 1; background: rgba(255,255,255,.05); }
.nav a[aria-current="page"] { opacity: 1; background: rgba(241,213,140,.1); color: var(--gold-hi); }
.nav svg { width: 18px; height: 18px; flex: none; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: .8rem; }
.side-foot label { opacity: .7; }
.side-foot select { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); color: var(--brand-ink); border-radius: 8px; padding: 8px; width: 100%; }
.side-foot select option { color: #17191c; background: #fff; }
.demo-tag { font-family: var(--f-caps); font-size: .6rem; text-transform: uppercase; letter-spacing: .14em; background: rgba(241,213,140,.14); color: var(--gold-hi); padding: 3px 9px; border-radius: 999px; align-self: flex-start; }

main { padding: 24px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar .crumb { font-weight: 600; }
.topbar .crumb span { color: var(--muted); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
.chip.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 3px var(--up-soft); }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.span2 { grid-column: span 2; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

/* ---------- quadro (placa física em miniatura) ---------- */
.plaque { container-type: inline-size; width: 100%; aspect-ratio: 4 / 5; border-radius: 3px; padding: 9%;
  background: linear-gradient(135deg, #d7b98c 0%, #b48f5e 35%, #caa778 60%, #a88456 100%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.15), inset 3px 3px 0 rgba(255,255,255,.25), inset -3px -3px 0 rgba(0,0,0,.18), 0 10px 24px rgba(0,0,0,.22); }
.plaque .panel { position: relative; height: 100%; padding: 7% 7% 5%; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  background: radial-gradient(ellipse at 50% 32%, color-mix(in srgb, var(--pc) 80%, #fff 20%), var(--pc) 70%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
.plaque.filete .panel { box-shadow: inset 0 0 0 1.5cqw #c9a24a, inset 0 0 0 calc(1.5cqw + 1px) rgba(0,0,0,.4); }
.plaque .inner { flex: 1; width: 100%; border: .6cqw solid #c9a24a; outline: 1px solid rgba(201,162,74,.5); outline-offset: -2.4cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2cqw; text-align: center; padding: 4cqw; }
.plaque .inner svg { width: 9cqw; height: auto; }
.plaque .org { font-family: var(--f-caps); font-size: 2.8cqw; letter-spacing: .35em; color: #d9b864; margin-top: -1cqw; }
.plaque .amt { font-family: var(--f-serif); font-weight: 600; font-size: 17cqw; line-height: .9; display: flex; align-items: flex-start; gap: 1.5cqw;
  background: linear-gradient(180deg, #f7e3a4 0%, #d6ab4c 55%, #b48322 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.plaque .amt small { font-size: 6cqw; margin-top: 1.6cqw; }
.plaque .lv { font-family: var(--f-caps); font-weight: 600; font-size: 4.4cqw; letter-spacing: .2em; color: #e2c372; border-block: 1px solid rgba(201,162,74,.45); padding: 1.6cqw 3cqw; white-space: nowrap; }
.plaque .tag { font-family: var(--f-serif); font-style: italic; font-size: 4cqw; color: rgba(255,255,255,.72); }
.plaque .name { margin-top: 4cqw; background: linear-gradient(180deg, #f1d58c, #c39a3e); color: #2a2213; font-family: var(--f-caps); font-weight: 600; font-size: 3.4cqw; letter-spacing: .14em; padding: 1.6cqw 4cqw; text-transform: uppercase; box-shadow: 0 1px 2px rgba(0,0,0,.4); white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.plaque.locked { filter: grayscale(.55) brightness(.8); opacity: .7; }
.plaque.empty { background: none; box-shadow: none; border: 2px dashed rgba(241,213,140,.35); display: grid; place-items: center; text-align: center; color: inherit; opacity: .8; font-size: .8rem; padding: 12%; }

/* ---------- hero do painel ---------- */
.hero { background: var(--brand); color: var(--brand-ink); border-radius: calc(var(--r) + 4px); padding: 28px; display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1.3fr); gap: 28px; position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(2.2rem, 4.4vw, 3.2rem); color: var(--gold-hi); }
.hero .sub { opacity: .75; font-size: .92rem; }
.hero-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.hero-tags .t { background: rgba(255,255,255,.07); border-radius: 999px; padding: 4px 12px; font-size: .82rem; }
.hero-tags .t b { color: var(--gold-hi); }
.trail { display: grid; grid-template-columns: 110px minmax(0,1fr) 110px; align-items: center; gap: 18px; }
.trail .lbl { font-family: var(--f-caps); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; text-align: center; margin-top: 8px; opacity: .8; }
.bar { height: 10px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #b48322, #f1d58c); border-radius: inherit; }
.bar.light { background: var(--surface-2); border: 1px solid var(--line); }
.bar.light > i { background: var(--gold); }
.bar.up > i { background: var(--up); }
.trail-info { display: flex; justify-content: space-between; font-size: .82rem; opacity: .9; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
.trail-info b { color: var(--gold-hi); font-variant-numeric: tabular-nums; }

.stat .v { font-size: 1.5rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat .d { font-size: .82rem; }

/* ---------- disputa ---------- */
.rival { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.rival .p { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.rival .p.me { border-color: var(--gold); background: var(--gold-soft); }
.rival .vs { font-family: var(--f-serif); font-weight: 700; font-size: 1.5rem; color: var(--muted); }
.rival .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- rankings ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--muted); text-decoration: none; }
.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.controls { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 12px; align-items: end; }
.pod { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.pod .pos { font-family: var(--f-serif); font-weight: 700; font-size: 2.6rem; line-height: 1; }
.pod.p1 { padding-block: 24px; border-color: var(--gold); background: linear-gradient(180deg, var(--gold-soft), var(--surface)); }
.pod.p1 .pos { color: var(--gold); }
.pod .n { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod .v { font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem; color: #fff; flex: none; }
.pod .avatar { width: 56px; height: 56px; font-size: 1.05rem; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font-family: var(--f-caps); font-size: .64rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.me td { background: var(--gold-soft); }
.who { display: flex; align-items: center; gap: 10px; }
.who .avatar { width: 32px; height: 32px; font-size: .75rem; }
.who small { display: block; color: var(--muted); font-size: .76rem; }
.mv { font-size: .76rem; font-weight: 600; }
.rank { font-family: var(--f-serif); font-weight: 700; font-size: 1.25rem; width: 2em; display: inline-block; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 4px; font-size: .74rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 0 2px #c9a24a; }

/* ---------- quadros & prêmios ---------- */
.wall { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 20px; }
.wall figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
.wall figcaption { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.wall figcaption b { font-family: var(--f-caps); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; }
.wall figcaption span { font-size: .78rem; color: var(--muted); }
.prize-list { display: flex; flex-direction: column; }
.prize { display: grid; grid-template-columns: 112px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.prize:last-child { border-bottom: 0; }
.prize .meta { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.badge { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--up-soft); color: var(--up); }
.badge.no { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.badge.gold { background: var(--gold-soft); color: var(--gold); }

/* ---------- campeonato ---------- */
.champ { background: var(--brand); color: var(--brand-ink); border-radius: calc(var(--r) + 4px); padding: 28px; display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 24px; }
.champ h1 { color: var(--gold-hi); font-size: clamp(2.4rem, 5vw, 3.6rem); }
.countdown { display: flex; gap: 10px; }
.countdown div { background: rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px; text-align: center; min-width: 64px; }
.countdown b { display: block; font-family: var(--f-serif); font-size: 2rem; color: var(--gold-hi); line-height: 1; }
.countdown span { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
.payout { display: flex; flex-direction: column; gap: 6px; }
.payout div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,.05); }
.payout div:first-child { background: rgba(241,213,140,.16); }
.payout b { color: var(--gold-hi); text-align: right; }
.rules { margin: 0; padding-left: 18px; font-size: .9rem; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.duel { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.duel .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.duel .row .n { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.duel .split { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.duel .split i:first-child { background: var(--gold); }
.duel .split i:last-child { background: var(--muted); opacity: .4; }
.clan { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.clan:last-child { border-bottom: 0; }
.clan .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-serif); font-weight: 700; font-size: 1.2rem; color: #fff; }

/* ---------- hall ---------- */
.feed { display: flex; flex-direction: column; }
.feed-item { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.feed-item:last-child { border-bottom: 0; }
.feed-item .dot { width: 26px; height: 26px; border-radius: 6px; background: var(--pc); box-shadow: inset 0 0 0 2px #c9a24a; }
.feed-item svg { width: 26px; height: 26px; }

svg text { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.note { font-size: .8rem; color: var(--muted); }
.viewas-mobile { display: none; align-items: center; gap: 8px; font-size: .85rem; }
.viewas-mobile select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 60vw; }

@media (max-width: 1180px) {
  .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .hero, .champ { grid-template-columns: 1fr; }
  .wall { grid-template-columns: repeat(3, minmax(0,1fr)); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; flex-direction: row; align-items: center; padding: 10px 16px; gap: 14px; }
  .brand { padding: 0; }
  .brand svg { width: 26px; }
  .brand div { display: none; }
  .nav { flex-direction: row; overflow-x: auto; gap: 2px; min-width: 0; flex: 1; scrollbar-width: none; }
  .nav a { padding: 8px 10px; font-size: .88rem; }
  .nav a svg { display: none; }
  .side-foot { display: none; }
  .g2, .g3 { grid-template-columns: minmax(0,1fr); }
  .span2 { grid-column: auto; }
  .viewas-mobile { display: flex; }
  .wall { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
}
@media (max-width: 520px) {
  .g4 { grid-template-columns: 1fr 1fr; }
  .hero, .champ { padding: 20px; }
  .trail { grid-template-columns: 76px minmax(0,1fr) 76px; gap: 10px; }
  .podium { gap: 8px; }
  .pod .pos { font-size: 2rem; }
  .pod .v { font-size: .9rem; }
  .countdown div { min-width: 0; flex: 1; padding: 8px 4px; }
  .prize { grid-template-columns: 80px minmax(0,1fr); }
  .prize .badge { grid-column: 2; justify-self: start; }
  .stat .v { font-size: 1.2rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar > i { transition: width .8s cubic-bezier(.2,.7,.2,1); }
  .view-enter { animation: rise .35s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>

<div class="app">
  <aside class="side">
    <div class="brand" id="brand"></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="side-foot">
      <span class="demo-tag">Modo demonstração</span>
      <label for="viewas">Ver painel como</label>
      <select id="viewas"></select>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <div class="viewas-mobile"><label for="viewas-m">Ver como</label><select id="viewas-m"></select></div>
        <span class="chip live" id="updated"></span>
      </div>
    </div>
    <section id="view" class="grid"></section>
  </main>
</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — ajuste aqui as regras da Legião
   Todos os valores em dólar (US$).
   ===================================================================== */
const CONFIG = {

/* =====================================================================
   CÁLCULOS
   ===================================================================== */
const N = CONFIG.meses.length, LAST = N - 1;
const sum = a => a.reduce((s, v) => s + v, 0);
const usd = v => (v < 0 ? "−" : "") + "US$ " + Math.abs(Math.round(v)).toLocaleString("pt-BR");
const usdK = v => { const a = Math.abs(v); return (v < 0 ? "−" : "") + (a >= 1000 ? (a / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "K" : String(Math.round(a))); };
const pct = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(1).replace(".", ",") + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const range = (a, b) => Array.from({ length: Math.max(0, b - a + 1) }, (_, i) => a + i);

ALUNOS.forEach(a => {
  a.saques = a.saques || Array(N).fill(0);
  a.cap = []; let c = 0;
  for (let m = 0; m < N; m++) { c += a.aportes[m] - a.saques[m] + a.lucro[m]; a.cap.push(c); }
  a.saldo = c;
  a.aportado = sum(a.aportes) - sum(a.saques);
  a.lucroTotal = sum(a.lucro);
  a.iniciais = a.nome.split(" ").filter(Boolean).map(p => p[0]).slice(0, 2).join("").toUpperCase();
  let s = 0; for (let m = LAST; m >= 0 && a.aportes[m] > 0; m--) s++;
  a.sequencia = s;   // meses seguidos aportando
});
const lucroP = (a, idx) => sum(idx.map(m => a.lucro[m]));
const aporteP = (a, idx) => sum(idx.map(m => a.aportes[m] - a.saques[m]));
const saldoAt = (a, idx) => a.cap[idx[idx.length - 1]];
// rentabilidade do copy no mês (igual para todos): calculada a partir de qualquer conta ativa
const rentCopy = m => { const a = ALUNOS.find(x => x.lucro[m]); if (!a) return 0; return a.lucro[m] / ((m ? a.cap[m - 1] : 0) + a.aportes[m] - a.saques[m]); };

const placaDe = v => { let p = CONFIG.placas[0]; for (const t of CONFIG.placas) if (v >= t.min) p = t; return p; };
const proxPlaca = v => CONFIG.placas.find(t => t.min > v) || null;
const proxPremio = v => CONFIG.premios.find(p => p.meta > v) || null;

const C = CONFIG.campeonato;
const PERIODOS = {
  mes:       { nome: CONFIG.mesesLongos[LAST], idx: [LAST], prev: [LAST - 1] },
  temporada: { nome: C.temporada, idx: C.meses, prev: C.meses.slice(0, -1) },
  geral:     { nome: "Desde o início", idx: range(0, LAST), prev: range(0, LAST - 1) }
};
const METRICAS = {
  aportes: { nome: "Aportes",        col: "Aportado", val: (a, i) => aporteP(a, i), ok: (a, i) => aporteP(a, i) > 0, periodo: true },
  saldo:   { nome: "Saldo na conta", col: "Saldo",    val: (a, i) => saldoAt(a, i), ok: (a, i) => saldoAt(a, i) > 0, periodo: false },
  lucro:   { nome: "Lucro",          col: "Lucro",    val: (a, i) => lucroP(a, i),  ok: (a, i) => lucroP(a, i) !== 0, periodo: true }
};
function ranking(metrica, idx) {
  const M = METRICAS[metrica];
  return ALUNOS.filter(a => M.ok(a, idx)).map(a => ({ a, v: M.val(a, idx) })).sort((x, y) => y.v - x.v);
}
const copa = () => ALUNOS.map(a => ({ a, v: aporteP(a, C.meses) })).filter(x => x.v >= C.aporteMinimo).sort((x, y) => y.v - x.v);
function posicao(metrica, idx, id) { const r = ranking(metrica, idx); const i = r.findIndex(x => x.a.id === id); return i < 0 ? null : i + 1; }

function clasRanking(idx) {
  return Object.entries(CONFIG.clas).map(([id, c]) => {
    const mem = ALUNOS.filter(a => a.cla === id);
    const total = sum(mem.map(a => aporteP(a, idx)));
    const ativos = mem.filter(a => aporteP(a, idx) > 0).length;
    const mvp = mem.slice().sort((x, y) => aporteP(y, idx) - aporteP(x, idx))[0];
    return { id, ...c, membros: mem.length, ativos, total, mvp };
  }).sort((x, y) => y.total - x.total);
}

function eventos() {
  const ev = [];
  ALUNOS.forEach(a => {
    for (let m = 0; m < N; m++) {
      const antes = m ? a.cap[m - 1] : 0, lAntes = m ? sum(a.lucro.slice(0, m)) : 0, lDepois = sum(a.lucro.slice(0, m + 1));
      CONFIG.placas.forEach(t => { if (t.min > 0 && antes < t.min && a.cap[m] >= t.min) ev.push({ m, a, t, peso: t.min, txt: `conquistou o quadro <b>${t.nome}</b> · US$ ${usdK(t.min)}` }); });
      CONFIG.premios.forEach(p => { if (lAntes < p.meta && lDepois >= p.meta) ev.push({ m, a, p, peso: p.meta / 10, txt: `ganhou <b>${esc(p.nome)}</b> ao passar ${usd(p.meta)} de lucro` }); });
      if (a.aportes[m] >= 10000) ev.push({ m, a, ap: true, peso: a.aportes[m] / 5, txt: `aportou <b>${usd(a.aportes[m])}</b>` });
    }
  });
  return ev.sort((x, y) => y.m - x.m || y.peso - x.peso);
}

function plaque(t, opts = {}) {

const avatar = a => `<span class="avatar" style="background:${CONFIG.clas[a.cla].cor}" aria-hidden="true">${a.iniciais}</span>`;

const mv = d => d == null ? `<span class="mv muted">novo</span>` : d > 0 ? `<span class="mv up">▲${d}</span>` : d < 0 ? `<span class="mv down">▼${-d}</span>` : `<span class="mv muted">—</span>`;

function nice(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function ticks(max, n = 4) { const step = nice(max / n); const top = Math.ceil(max / step) * step; return { top, step, list: range(0, Math.round(top / step)).map(i => i * step) }; }

function lineChart(a) {
  const W = 600, H = 230, L = 52, R = 16, T = 18, B = 28, iw = W - L - R, ih = H - T - B;
  const ap = []; let s = 0; a.aportes.forEach((v, i) => ap.push(s += v - a.saques[i]));
  const tk = ticks(Math.max(1, ...a.cap, ...ap)), max = tk.top;
  const x = i => L + (N === 1 ? iw / 2 : i * iw / (N - 1)), y = v => T + ih - v / max * ih;
  const grid = tk.list.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--chart-grid)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${usdK(v)}</text>`).join("");
  const xl = CONFIG.meses.map((m, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${m}</text>`).join("");
  const nxt = proxPlaca(a.saldo);
  const meta = nxt && nxt.min <= max ? `<line x1="${L}" x2="${W - R}" y1="${y(nxt.min)}" y2="${y(nxt.min)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="2 4"/><text x="${L + 6}" y="${y(nxt.min) - 6}" style="fill:var(--gold);font-weight:600">${nxt.nome} · US$ ${usdK(nxt.min)}</text>` : "";
  const pts = a.cap.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const apPts = ap.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const area = `M${x(0)},${y(0)} L${pts.replace(/ /g, " L")} L${x(LAST)},${y(0)} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução do saldo">
    ${grid}${xl}${meta}
    <path d="${area}" fill="var(--chart-fill)"/>
    <polyline points="${apPts}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polyline points="${pts}" fill="none" stroke="var(--chart-line)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(LAST)}" cy="${y(a.cap[LAST])}" r="5" fill="var(--chart-line)" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}
function barChart(a) {
  const W = 600, H = 230, L = 52, R = 16, T = 22, B = 28, iw = W - L - R, ih = H - T - B;
  const vals = a.aportes.map((v, i) => v - a.saques[i]);
  const tk = ticks(Math.max(1, ...vals)), hi = tk.top, mn = Math.min(0, ...vals), lo = mn < 0 ? -Math.ceil(-mn / tk.step) * tk.step : 0;
  const y = v => T + (hi - v) / (hi - lo) * ih, bw = iw / N * .5;
  const tl = []; for (let v = lo; v <= hi + 1e-9; v += tk.step) tl.push(v);
  const grid = tl.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--chart-grid)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${usdK(v)}</text>`).join("");
  const bars = vals.map((v, i) => {
    const cx = L + iw / N * (i + .5), top = y(Math.max(v, 0)), hgt = Math.max(Math.abs(y(v) - y(0)), v ? 2 : 0);
    const inCopa = C.meses.includes(i);
    const lab = v ? `<text x="${cx}" y="${v >= 0 ? top - 6 : top + hgt + 13}" text-anchor="middle" style="fill:var(--ink)">${usdK(v)}</text>` : "";
    return `<rect x="${cx - bw / 2}" y="${top}" width="${bw}" height="${hgt}" rx="4" fill="${v < 0 ? "var(--down)" : inCopa ? "var(--gold)" : "var(--chart-line)"}" ${inCopa ? "" : 'opacity=".5"'}/>${lab}<text x="${cx}" y="${H - 8}" text-anchor="middle">${CONFIG.meses[i]}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Aportes por mês">${grid}${bars}</svg>`;
}

function viewRanking() {
  const P = PERIODOS[state.periodo], M = METRICAS[state.metrica];
  const tabs = Object.entries(METRICAS).map(([k, m]) => `<button class="tab" data-metrica="${k}" aria-pressed="${k === state.metrica}">${m.nome}</button>`).join("") +
    `<button class="tab" data-metrica="clas" aria-pressed="${state.metrica === "clas"}">Clãs</button>`;
  const usaPeriodo = state.metrica === "clas" || M.periodo;
  const seg = `<div class="seg" role="group" aria-label="Período">${Object.entries(PERIODOS).map(([k, p]) => `<button data-periodo="${k}" aria-pressed="${k === state.periodo}">${k === "mes" ? p.nome : k === "temporada" ? "Temporada" : "Geral"}</button>`).join("")}</div>`;
  const head = `<div class="controls"><div class="tabs">${tabs}</div>${usaPeriodo ? seg : '<span class="note">Saldo atual na conta copiada</span>'}</div>`;

  if (state.metrica === "clas") {
    const cr = clasRanking(P.idx);
    return head + `<div class="card"><div class="card-head"><h3>Guerra de Clãs · ${P.nome}</h3><span class="note">Aporte somado dos membros</span></div>
      ${cr.map((c, i) => `<div class="clan"><div class="ico" style="background:${c.cor}">${i + 1}</div>
        <div style="min-width:0"><div style="font-weight:700">${c.nome}</div><div class="note">${c.ativos} de ${c.membros} aportaram${c.mvp && aporteP(c.mvp, P.idx) > 0 ? ` · destaque: ${esc(c.mvp.apelido)}` : ""}</div></div>
        <div class="num">${usd(c.total)}</div></div>`).join("")}</div>`;
  }

  const idx = M.periodo ? P.idx : PERIODOS.geral.idx;
  const prevIdx = M.periodo ? P.prev : PERIODOS.geral.prev;
  const rk = ranking(state.metrica, idx);
  const prevRk = prevIdx.length ? ranking(state.metrica, prevIdx) : [];
  const prevPos = id => { const j = prevRk.findIndex(x => x.a.id === id); return j < 0 ? null : j + 1; };
  const top = rk.slice(0, 3);
  const cls = v => state.metrica === "lucro" ? (v >= 0 ? "up" : "down") : "";
  const pod = (x, n) => x ? `<div class="pod p${n}">${avatar(x.a)}<div class="pos">${n}º</div><div class="n">${esc(x.a.apelido)}</div><div class="v ${cls(x.v)}">${usd(x.v)}</div>${placaPill(x.a)}</div>` : "<div></div>";
  const rows = rk.map((x, i) => {
    const pp = prevPos(x.a.id), d = pp == null ? null : pp - (i + 1);
    return `<tr class="${x.a.id === state.me ? "me" : ""}"><td><span class="rank">${i + 1}</span>${prevIdx.length ? mv(d) : ""}</td><td>${who(x.a)}</td><td>${placaPill(x.a)}</td><td class="r num ${cls(x.v)}">${usd(x.v)}</td></tr>`;
  }).join("");
  const nota = state.metrica === "lucro" ? `<span class="note">O % do copy é igual para todos; o lucro em US$ acompanha o tamanho da conta</span>` : `<span class="note">${rk.length} participantes</span>`;
  return head + `
    <div class="podium">${pod(top[1], 2)}${pod(top[0], 1)}${pod(top[2], 3)}</div>
    <div class="card"><div class="card-head"><h3>${M.nome} · ${M.periodo ? P.nome : "atual"}</h3>${nota}</div>
    <div class="table-wrap"><table><thead><tr><th>Pos.</th><th>Aluno</th><th>Quadro</th><th class="r">${M.col}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

    <div class="card">
      <div class="card-head"><h3>Conquistas recentes</h3><span class="chip live">ao vivo</span></div>
      <div class="feed">${ev.map(e => `<div class="feed-item">${e.t ? `<span class="dot" style="--pc:${e.t.cor}"></span>` : `<svg viewBox="0 0 24 24" fill="none" stroke="${e.ap ? "var(--gold)" : "var(--up)"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${e.ap ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : ICON.campeonato}</svg>`}<div style="min-width:0"><b>${esc(e.a.apelido)}</b> ${e.txt}</div><span class="note">${CONFIG.meses[e.m]}</span></div>`).join("")}</div>
    </div>
  </div>`;
}

/* =====================================================================
   NAVEGAÇÃO
   ===================================================================== */
let timer;
function tick() {
  const el = document.getElementById("countdown"); if (!el) return;
  let s = Math.max(0, (new Date(C.fim) - new Date()) / 1000);
  const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60);
  el.innerHTML = [[d, "dias"], [h, "horas"], [m, "min"]].map(([v, l]) => `<div><b>${String(v).padStart(2, "0")}</b><span>${l}</span></div>`).join("");
}
function render() {
  const v = document.getElementById("view");
  const fn = { painel: viewPainel, campeonato: viewCampeonato, ranking: viewRanking, quadros: viewQuadros, hall: viewHall }[state.view];
  v.innerHTML = fn();
  v.classList.remove("view-enter"); void v.offsetWidth; v.classList.add("view-enter");
  document.querySelectorAll(".nav a").forEach(a => { const on = a.dataset.v === state.view; a.setAttribute("aria-current", on ? "page" : "false"); if (on && innerWidth <= 820) a.scrollIntoView({ block: "nearest", inline: "nearest" }); });
  document.getElementById("crumb").innerHTML = `${VIEWS[state.view]} <span>· ${esc(me().nome)}</span>`;
  clearInterval(timer); if (state.view === "campeonato") { tick(); timer = setInterval(tick, 30000); }
}
function boot() {
  document.getElementById("brand").innerHTML = `${LOGO("#f1d58c", "Legatus Group")}<div><b>${esc(CONFIG.marca.nome)}</b><span>${esc(CONFIG.marca.sub)}</span></div>`;
  document.getElementById("nav").innerHTML = Object.entries(VIEWS).map(([k, n]) => `<a href="#${k}" data-v="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>${n}</a>`).join("");
  const opts = ALUNOS.slice().sort((x, y) => x.nome.localeCompare(y.nome)).map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join("");
  ["viewas", "viewas-m"].forEach(id => { const s = document.getElementById(id); s.innerHTML = opts; s.value = state.me; s.addEventListener("change", e => { state.me = e.target.value; document.querySelectorAll("#viewas,#viewas-m").forEach(o => o.value = state.me); save(); render(); }); });
  document.getElementById("updated").textContent = "Atualizado em " + new Date(CONFIG.atualizadoEm + "T12:00:00").toLocaleDateString("pt-BR");
  document.getElementById("view").addEventListener("click", e => {
    const b = e.target.closest("[data-metrica],[data-periodo]"); if (!b) return;
    if (b.dataset.metrica) state.metrica = b.dataset.metrica;
    if (b.dataset.periodo) state.periodo = b.dataset.periodo;
    save(); render();
  });
  const fromHash = () => { const h = location.hash.slice(1); state.view = VIEWS[h] ? h : "painel"; render(); window.scrollTo(0, 0); };
  window.addEventListener("hashchange", fromHash);
  fromHash();
}
boot();
</script>
