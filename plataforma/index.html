<title>Legião Legatus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral escura da marca + área principal em grade; vira barra superior rolável no celular.
   Mundo visual: os quadros da Legião (moldura de carvalho, painel em pedra preciosa, letras em ouro). */
:root {
  --bg: #edebe7;
  --surface: #ffffff;
  --surface-2: #f6f4f1;
  --ink: #17191c;
  --muted: #646a72;
  --line: #dcd8d1;
  --brand: #0f1d18;
  --brand-ink: #ece7dc;
  --gold: #9c7420;
  --on-gold: #ffffff;
  --gold-soft: #f4ead3;
  --gold-hi: #f1d58c;
  --up: #12804c;
  --up-soft: #e1f3e9;
  --down: #c13d2c;
  --down-soft: #fbe6e2;
  --chart-line: #0f4a35;
  --chart-fill: rgba(15,74,53,.10);
  --chart-grid: #e6e2dc;
  --f-serif: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --f-caps: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1110; --surface: #151a19; --surface-2: #1a201f; --ink: #ebe8e2; --muted: #9aa19e; --line: #28302e;
    --brand: #0a1411; --gold: #e0b95c; --on-gold: #1a1408; --gold-soft: #33291a; --up: #3ccf88; --up-soft: #12291e; --down: #ff7a66; --down-soft: #3a1c18;
    --chart-line: #e0b95c; --chart-fill: rgba(224,185,92,.13); --chart-grid: #232b29;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1110; --surface: #151a19; --surface-2: #1a201f; --ink: #ebe8e2; --muted: #9aa19e; --line: #28302e;
  --brand: #0a1411; --gold: #e0b95c; --on-gold: #1a1408; --gold-soft: #33291a; --up: #3ccf88; --up-soft: #12291e; --down: #ff7a66; --down-soft: #3a1c18;
  --chart-line: #e0b95c; --chart-fill: rgba(224,185,92,.13); --chart-grid: #232b29;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-family: var(--f-serif); font-weight: 600; }
h2, h3 { font-family: var(--f-caps); font-weight: 600; letter-spacing: .01em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
.eyebrow { font-family: var(--f-caps); font-size: .68rem; text-transform: uppercase; letter-spacing: .16em; font-weight: 600; color: var(--muted); }

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100vh; }
.side { background: var(--brand); color: var(--brand-ink); padding: 28px 16px 20px; display: flex; flex-direction: column; gap: 28px; position: sticky; top: 0; height: 100vh; }
.brand { padding-inline: 10px; display: flex; align-items: center; gap: 12px; }
.brand svg { width: 34px; height: auto; flex: none; }
.brand div { display: flex; flex-direction: column; gap: 2px; }
.brand b { font-family: var(--f-caps); font-weight: 500; letter-spacing: .3em; font-size: 1rem; color: var(--gold-hi); line-height: 1.1; }
.brand span { font-family: var(--f-caps); font-size: .58rem; letter-spacing: .38em; opacity: .65; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav .grp { font-family: var(--f-caps); font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; opacity: .45; padding: 12px 12px 4px; }
.nav a { color: var(--brand-ink); text-decoration: none; padding: 10px 12px; border-radius: 10px; font-weight: 600; display: flex; align-items: center; gap: 10px; opacity: .74; white-space: nowrap; }
.nav a:hover { opacity: 1; background: rgba(255,255,255,.05); }
.nav a[aria-current="page"] { opacity: 1; background: rgba(241,213,140,.1); color: var(--gold-hi); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; background: #e0b95c; color: #1a1408; font-size: .72rem; font-weight: 700; border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: .82rem; }
.who-box { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.05); }
.who-box small { display: block; opacity: .6; font-size: .72rem; }
.link-btn { background: none; border: 0; color: var(--gold-hi); cursor: pointer; padding: 0; font-weight: 600; text-align: left; }
.demo-tag { font-family: var(--f-caps); font-size: .6rem; text-transform: uppercase; letter-spacing: .14em; background: rgba(241,213,140,.14); color: var(--gold-hi); padding: 3px 9px; border-radius: 999px; align-self: flex-start; }

main { padding: 24px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar .crumb { font-weight: 600; }
.topbar .crumb span { color: var(--muted); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
.chip.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 3px var(--up-soft); }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.span2 { grid-column: span 2; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--gold-soft); border: 1px solid var(--gold); border-radius: var(--r); padding: 14px 18px; }

/* ---------- formulários e botões ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: .82rem; font-weight: 600; }
.field small { color: var(--muted); font-size: .76rem; }
.field input, .field select, .field textarea, .inp { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.field textarea { min-height: 70px; resize: vertical; }
.inp.sm { padding: 6px 10px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.ok { background: var(--up); border-color: var(--up); color: #fff; }
.btn.danger { color: var(--down); }
.btn.sm { padding: 6px 12px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--surface-2); }
.drop:hover, .drop.over { border-color: var(--gold); }
.drop img { max-height: 240px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.status { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.status.pendente, .status.a_produzir { background: var(--gold-soft); color: var(--gold); }
.status.aprovado, .status.entregue { background: var(--up-soft); color: var(--up); }
.status.recusado { background: var(--down-soft); color: var(--down); }
.status.producao, .status.enviado { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }

/* ---------- fila de aprovação ---------- */
.queue { display: flex; flex-direction: column; gap: 14px; }
.q-item { display: grid; grid-template-columns: 150px minmax(0,1fr) minmax(0, 300px); gap: 18px; align-items: start; border: 1px solid var(--line); border-radius: var(--r); padding: 16px; background: var(--surface); }
.q-item .thumb { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; background: var(--surface-2); }
.q-item dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .9rem; }
.q-item dt { color: var(--muted); }
.q-item dd { margin: 0; font-weight: 600; }
.q-act { display: flex; flex-direction: column; gap: 10px; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: grid; place-items: center; z-index: 50; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 60; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }

/* ---------- login ---------- */
.login { min-height: 100vh; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); padding: 24px 16px; }
.login-card { width: min(440px, 100%); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.login-mark { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 4px; }
.login-mark svg { width: 56px; }
.login-mark b { font-family: var(--f-caps); letter-spacing: .3em; color: var(--gold); }

/* ---------- quadro (placa física em miniatura) ---------- */
.plaque { container-type: inline-size; width: 100%; aspect-ratio: 4 / 5; border-radius: 3px; padding: 9%;
  background: linear-gradient(135deg, #d7b98c 0%, #b48f5e 35%, #caa778 60%, #a88456 100%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.15), inset 3px 3px 0 rgba(255,255,255,.25), inset -3px -3px 0 rgba(0,0,0,.18), 0 10px 24px rgba(0,0,0,.22); }
.plaque .panel { position: relative; height: 100%; padding: 7% 7% 5%; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  background: radial-gradient(ellipse at 50% 32%, color-mix(in srgb, var(--pc) 80%, #fff 20%), var(--pc) 70%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
.plaque.filete .panel { box-shadow: inset 0 0 0 1.5cqw #c9a24a, inset 0 0 0 calc(1.5cqw + 1px) rgba(0,0,0,.4); }
.plaque .inner { flex: 1; width: 100%; border: .6cqw solid #c9a24a; outline: 1px solid rgba(201,162,74,.5); outline-offset: -2.4cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2cqw; text-align: center; padding: 4cqw; }
.plaque .inner svg { width: 9cqw; height: auto; }
.plaque .org { font-family: var(--f-caps); font-size: 2.8cqw; letter-spacing: .35em; color: #d9b864; margin-top: -1cqw; }
.plaque .amt { font-family: var(--f-serif); font-weight: 600; font-size: 17cqw; line-height: .9; display: flex; align-items: flex-start; gap: 1.5cqw;
  background: linear-gradient(180deg, #f7e3a4 0%, #d6ab4c 55%, #b48322 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.plaque .amt small { font-size: 6cqw; margin-top: 1.6cqw; }
.plaque .lv { font-family: var(--f-caps); font-weight: 600; font-size: 4.4cqw; letter-spacing: .2em; color: #e2c372; border-block: 1px solid rgba(201,162,74,.45); padding: 1.6cqw 3cqw; white-space: nowrap; }
.plaque .tag { font-family: var(--f-serif); font-style: italic; font-size: 4cqw; color: rgba(255,255,255,.72); }
.plaque .name { margin-top: 4cqw; background: linear-gradient(180deg, #f1d58c, #c39a3e); color: #2a2213; font-family: var(--f-caps); font-weight: 600; font-size: 3.4cqw; letter-spacing: .14em; padding: 1.6cqw 4cqw; text-transform: uppercase; box-shadow: 0 1px 2px rgba(0,0,0,.4); white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.plaque.locked { filter: grayscale(.55) brightness(.8); opacity: .7; }
.plaque.empty { background: none; box-shadow: none; border: 2px dashed rgba(241,213,140,.35); display: grid; place-items: center; text-align: center; color: inherit; opacity: .8; font-size: .8rem; padding: 12%; }

/* ---------- hero do painel ---------- */
.hero { background: var(--brand); color: var(--brand-ink); border-radius: calc(var(--r) + 4px); padding: 28px; display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1.3fr); gap: 28px; position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(2.2rem, 4.4vw, 3.2rem); color: var(--gold-hi); }
.hero .sub { opacity: .75; font-size: .92rem; }
.hero-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.hero-tags .t { background: rgba(255,255,255,.07); border-radius: 999px; padding: 4px 12px; font-size: .82rem; }
.hero-tags .t b { color: var(--gold-hi); }
.trail { display: grid; grid-template-columns: 110px minmax(0,1fr) 110px; align-items: center; gap: 18px; }
.trail .lbl { font-family: var(--f-caps); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; text-align: center; margin-top: 8px; opacity: .8; }
.bar { height: 10px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #b48322, #f1d58c); border-radius: inherit; }
.bar.light { background: var(--surface-2); border: 1px solid var(--line); }
.bar.light > i { background: var(--gold); }
.bar.up > i { background: var(--up); }
.trail-info { display: flex; justify-content: space-between; font-size: .82rem; opacity: .9; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
.trail-info b { color: var(--gold-hi); font-variant-numeric: tabular-nums; }

.stat .v { font-size: 1.5rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat .d { font-size: .82rem; }
a.card.stat { text-decoration: none; color: inherit; }
a.card.stat:hover { border-color: var(--gold); }

/* ---------- disputa ---------- */
.rival { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.rival .p { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.rival .p.me { border-color: var(--gold); background: var(--gold-soft); }
.rival .vs { font-family: var(--f-serif); font-weight: 700; font-size: 1.5rem; color: var(--muted); }
.rival .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- rankings ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--muted); text-decoration: none; }
.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; max-width: 100%; overflow-x: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { white-space: nowrap; border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.controls { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.controls > * { min-width: 0; max-width: 100%; }
.grid > * { min-width: 0; }

.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 12px; align-items: end; }
.pod { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.pod .pos { font-family: var(--f-serif); font-weight: 700; font-size: 2.6rem; line-height: 1; }
.pod.p1 { padding-block: 24px; border-color: var(--gold); background: linear-gradient(180deg, var(--gold-soft), var(--surface)); }
.pod.p1 .pos { color: var(--gold); }
.pod .n { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod .v { font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem; color: #fff; flex: none; }
.pod .avatar { width: 56px; height: 56px; font-size: 1.05rem; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font-family: var(--f-caps); font-size: .64rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.me td { background: var(--gold-soft); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.who { display: flex; align-items: center; gap: 10px; }
.who .avatar { width: 32px; height: 32px; font-size: .75rem; }
.who small { display: block; color: var(--muted); font-size: .76rem; }
.mv { font-size: .76rem; font-weight: 600; }
.rank { font-family: var(--f-serif); font-weight: 700; font-size: 1.25rem; width: 2em; display: inline-block; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 4px; font-size: .74rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 0 2px #c9a24a; }

/* ---------- quadros & prêmios ---------- */
.wall { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 20px; }
.wall figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
.wall figcaption { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.wall figcaption b { font-family: var(--f-caps); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; }
.wall figcaption span { font-size: .78rem; color: var(--muted); }
.prize-list { display: flex; flex-direction: column; }
.prize { display: grid; grid-template-columns: 112px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.prize:last-child { border-bottom: 0; }
.prize .meta { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.badge { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--up-soft); color: var(--up); }
.badge.no { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.badge.gold { background: var(--gold-soft); color: var(--gold); }

/* ---------- campeonato ---------- */
.champ { background: var(--brand); color: var(--brand-ink); border-radius: calc(var(--r) + 4px); padding: 28px; display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 24px; }
.champ h1 { color: var(--gold-hi); font-size: clamp(2.4rem, 5vw, 3.6rem); }
.countdown { display: flex; gap: 10px; }
.countdown div { background: rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px; text-align: center; min-width: 64px; }
.countdown b { display: block; font-family: var(--f-serif); font-size: 2rem; color: var(--gold-hi); line-height: 1; }
.countdown span { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
.payout { display: flex; flex-direction: column; gap: 6px; }
.payout div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,.05); }
.payout div:first-child { background: rgba(241,213,140,.16); }
.payout b { color: var(--gold-hi); text-align: right; }

/* =====================================================================

   Resultado do copy: % aplicado a todos com saldo na data.
   ===================================================================== */
let CACHE = new Map();

function eventos(id) {
  const k = "ev:" + id; if (CACHE.has(k)) return CACHE.get(k);
  const ls = DB.lanc.filter(l => l.aluno === id);
  const ini = ls.reduce((m, l) => l.data < m ? l.data : m, "9999");
  const ev = ls.concat(DB.copy.filter(c => c.data >= ini).map(c => ({ tipo: "resultado", data: c.data, pct: c.pct })))
    .sort((x, y) => x.data < y.data ? -1 : x.data > y.data ? 1 : ORDEM[x.tipo] - ORDEM[y.tipo]);
  CACHE.set(k, ev); return ev;
}
function estado(id, ate = "9999-12-31") {
  const k = id + "|" + ate; if (CACHE.has(k)) return CACHE.get(k);
  let saldo = 0, aportado = 0, pico = 0; const conq = {}, prem = {};
  for (const e of eventos(id)) {
    if (e.data > ate) break;
    if (e.tipo === "aporte") { saldo += e.valor; aportado += e.valor; }
    else if (e.tipo === "saque") { saldo -= e.valor; aportado -= e.valor; }
    else if (e.tipo === "saldo") saldo = e.valor;
    else if (e.tipo === "resultado" && saldo > 0) saldo *= 1 + e.pct / 100;
    pico = Math.max(pico, saldo);
    for (const t of CONFIG.placas) if (t.min > 0 && pico >= t.min && !conq[t.id]) conq[t.id] = e.data;
    for (const p of CONFIG.premios) if (saldo - aportado >= p.meta && !prem[p.meta]) prem[p.meta] = e.data;
  }
  const r = { saldo, aportado, lucro: saldo - aportado, pico, conq, prem };
  CACHE.set(k, r); return r;

const METRICAS = {
  aportes: { nome: "Aportes",        col: "Aportado", periodo: true,  val: (id, p) => aporteEntre(id, p.de, p.ate), ok: v => v > 0 },
  saldo:   { nome: "Saldo na conta", col: "Saldo",    periodo: false, val: (id, p) => estado(id, p.ate).saldo, ok: v => v > 0 },
  lucro:   { nome: "Lucro",          col: "Lucro",    periodo: true,  val: (id, p) => estado(id, p.ate).lucro - estado(id, addDias(p.de, -1)).lucro, ok: v => Math.abs(v) >= 1 }
};
function ranking(metrica, p) {
  const k = "rk:" + metrica + p.de + p.ate; if (CACHE.has(k)) return CACHE.get(k);
  const M = METRICAS[metrica];
  const r = DB.alunos.map(a => ({ a, v: M.val(a.id, p) })).filter(x => M.ok(x.v)).sort((x, y) => y.v - x.v);
  CACHE.set(k, r); return r;
}
function copa(ate = fimTemporada()) {
  return DB.alunos.map(a => ({ a, v: aporteEntre(a.id, C.inicio, ate) })).filter(x => x.v >= C.aporteMinimo).sort((x, y) => y.v - x.v);
}
function clasRanking(p) {
  return Object.entries(CONFIG.clas).map(([id, c]) => {
    const mem = DB.alunos.filter(a => a.cla === id);
    const vs = mem.map(a => ({ a, v: aporteEntre(a.id, p.de, p.ate) }));
    const mvp = vs.slice().sort((x, y) => y.v - x.v)[0];
    return { id, ...c, membros: mem.length, ativos: vs.filter(x => x.v > 0).length, total: sum(vs.map(x => x.v)), mvp: mvp && mvp.v > 0 ? mvp.a : null };
  }).sort((x, y) => y.total - x.total);
}
function conquistas() {
  const out = [];

    Object.entries(e.conq).forEach(([pid, d]) => { const t = CONFIG.placas.find(x => x.id === pid); out.push({ data: d, a, t, peso: t.min, txt: `conquistou o quadro <b>${t.nome}</b> · US$ ${usdK(t.min)}` }); });
    Object.entries(e.prem).forEach(([m, d]) => { const p = CONFIG.premios.find(x => x.meta == m); out.push({ data: d, a, p, peso: p.meta / 10, txt: `ganhou <b>${esc(p.nome)}</b> ao passar ${usd(p.meta)} de lucro` }); });
  });
  DB.lanc.filter(l => l.tipo === "aporte" && !l.inicial && l.valor >= 5000).forEach(l => { const a = aluno(l.aluno); if (a) out.push({ data: l.data, a, ap: true, peso: l.valor / 5, txt: `aportou <b>${usd(l.valor)}</b>` }); });
  return out.sort((x, y) => y.data.localeCompare(x.data) || y.peso - x.peso);
}

function nice(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function ticks(max, n = 4) { const step = nice(max / n); const top = Math.ceil(max / step) * step; const list = []; for (let v = 0; v <= top + 1e-9; v += step) list.push(v); return { top, step, list }; }

function lineChart(id) {
  const meses = ultimosMeses(6), W = 600, H = 230, L = 52, R = 16, T = 18, B = 28, iw = W - L - R, ih = H - T - B, n = meses.length;
  const sal = meses.map(m => estado(id, minIso(m.fim, HOJE)).saldo), ap = meses.map(m => Math.max(0, estado(id, minIso(m.fim, HOJE)).aportado));
  const nx = proxPlaca(estado(id).pico);
  const tk = ticks(Math.max(1, ...sal, ...ap)), max = tk.top;
  const x = i => L + i * iw / (n - 1), y = v => T + ih - v / max * ih;
  const grid = tk.list.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--chart-grid)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${usdK(v)}</text>`).join("");
  const xl = meses.map((m, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${m.label}</text>`).join("");
  const meta = nx && nx.min <= max ? `<line x1="${L}" x2="${W - R}" y1="${y(nx.min)}" y2="${y(nx.min)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="2 4"/><text x="${L + 6}" y="${y(nx.min) - 6}" style="fill:var(--gold);font-weight:600">${nx.nome} · US$ ${usdK(nx.min)}</text>` : "";
  const pts = sal.map((v, i) => `${x(i)},${y(v)}`).join(" "), apPts = ap.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução do saldo">${grid}${xl}${meta}
    <path d="M${x(0)},${y(0)} L${pts.replace(/ /g, " L")} L${x(n - 1)},${y(0)} Z" fill="var(--chart-fill)"/>
    <polyline points="${apPts}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polyline points="${pts}" fill="none" stroke="var(--chart-line)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(n - 1)}" cy="${y(sal[n - 1])}" r="5" fill="var(--chart-line)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
function barChart(id) {
  const meses = ultimosMeses(6), W = 600, H = 230, L = 52, R = 16, T = 22, B = 28, iw = W - L - R, ih = H - T - B, n = meses.length;
  const vals = meses.map(m => aporteEntre(id, m.ini, m.fim, true));
  const tk = ticks(Math.max(1, ...vals)), hi = tk.top, mn = Math.min(0, ...vals), lo = mn < 0 ? -Math.ceil(-mn / tk.step) * tk.step : 0;
  const y = v => T + (hi - v) / (hi - lo) * ih, bw = iw / n * .5;
  const tl = []; for (let v = lo; v <= hi + 1e-9; v += tk.step) tl.push(v);
  const grid = tl.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--chart-grid)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${usdK(v)}</text>`).join("");
  const bars = vals.map((v, i) => {
    const cx = L + iw / n * (i + .5), top = y(Math.max(v, 0)), hgt = Math.max(Math.abs(y(v) - y(0)), v ? 2 : 0);
    const naCopa = meses[i].fim >= C.inicio && meses[i].ini <= C.fim;
    const lab = v ? `<text x="${cx}" y="${v >= 0 ? top - 6 : top + hgt + 13}" text-anchor="middle" style="fill:var(--ink)">${usdK(v)}</text>` : "";
    return `<rect x="${cx - bw / 2}" y="${top}" width="${bw}" height="${hgt}" rx="4" fill="${v < 0 ? "var(--down)" : naCopa ? "var(--gold)" : "var(--chart-line)"}" ${naCopa ? "" : 'opacity=".5"'}/>${lab}<text x="${cx}" y="${H - 8}" text-anchor="middle">${meses[i].label}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Aportes por mês">${grid}${bars}</svg>`;
}

function viewRanking() {
  const P = periodos()[state.periodo], M = METRICAS[state.metrica];
  const meId = state.sess.role === "aluno" ? state.sess.id : null;
  const tabs = Object.entries(METRICAS).map(([k, m]) => `<button class="tab" data-metrica="${k}" aria-pressed="${k === state.metrica}">${m.nome}</button>`).join("") + `<button class="tab" data-metrica="clas" aria-pressed="${state.metrica === "clas"}">Clãs</button>`;
  const usaP = state.metrica === "clas" || M.periodo;
  const seg = `<div class="seg" role="group" aria-label="Período">${Object.entries(periodos()).map(([k, p]) => `<button data-periodo="${k}" aria-pressed="${k === state.periodo}">${k === "mes" ? p.nome : k === "temporada" ? "Temporada" : "Geral"}</button>`).join("")}</div>`;
  const head = `<div class="controls"><div class="tabs">${tabs}</div>${usaP ? seg : '<span class="note">Saldo atual na conta copiada</span>'}</div>`;
  if (state.metrica === "clas") {
    return head + `<div class="card"><div class="card-head"><h3>Guerra de Clãs · ${P.nome}</h3><span class="note">aporte somado dos membros</span></div>
      ${clasRanking(P).map((c, i) => `<div class="clan"><div class="ico" style="background:${c.cor}">${i + 1}</div><div style="min-width:0"><div style="font-weight:700">${c.nome}</div><div class="note">${c.ativos} de ${c.membros} aportaram${c.mvp ? " · destaque: " + esc(apelido(c.mvp)) : ""}</div></div><div class="num">${usd(c.total)}</div></div>`).join("")}</div>`;
  }
  const per = M.periodo ? P : periodos().geral;
  const rk = ranking(state.metrica, per);
  const sem = addDias(per.ate, -7), prevRk = sem >= per.de ? ranking(state.metrica, { de: per.de, ate: sem }) : null;
  const prevPos = id => { if (!prevRk) return undefined; const j = prevRk.findIndex(x => x.a.id === id); return j < 0 ? null : j + 1; };
  const cls = v => state.metrica === "lucro" ? (v >= 0 ? "up" : "down") : "";
  const pod = (x, n) => x ? `<div class="pod p${n}">${avatar(x.a)}<div class="pos">${n}º</div><div class="n">${esc(apelido(x.a))}</div><div class="v ${cls(x.v)}">${usd(x.v)}</div>${placaPill(x.a)}</div>` : "<div></div>";
  const rows = rk.map((x, i) => { const pp = prevPos(x.a.id); return `<tr class="${x.a.id === meId ? "me" : ""}"><td><span class="rank">${i + 1}</span>${pp === undefined ? "" : mv(pp == null ? null : pp - (i + 1))}</td><td>${who(x.a)}</td><td>${placaPill(x.a)}</td><td class="r num ${cls(x.v)}">${usd(x.v)}</td></tr>`; }).join("");
  return head + (rk.length ? `<div class="podium">${pod(rk[1], 2)}${pod(rk[0], 1)}${pod(rk[2], 3)}</div>` : "") + `
    <div class="card"><div class="card-head"><h3>${M.nome} · ${M.periodo ? P.nome : "atual"}</h3><span class="note">${prevRk ? "setas: posição vs. 7 dias atrás · " : ""}${rk.length} participantes</span></div>
    ${rk.length ? `<div class="table-wrap"><table><thead><tr><th>Pos.</th><th>Aluno</th><th>Quadro</th><th class="r">${M.col}</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty-state">Nenhum ${M.nome.toLowerCase()} neste período ainda.</div>`}</div>`;
}

function comprimir(file) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith("image/")) return rej(new Error("Escolha uma imagem (JPG ou PNG)."));
    const r = new FileReader();
    r.onerror = () => rej(new Error("Não foi possível ler a imagem."));
    r.onload = () => { const img = new Image(); img.onerror = () => rej(new Error("Imagem inválida.")); img.onload = () => {
      const k = Math.min(1, 1100 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", .72)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}
let printAtual = null;
async function usarArquivo(file) {
  const msg = document.getElementById("env-msg");
  try { printAtual = await comprimir(file); const im = document.getElementById("drop-img"); im.src = printAtual; im.hidden = false; document.getElementById("drop-txt").innerHTML = '<span class="note">Toque para trocar o print</span>'; msg.textContent = ""; }
  catch (err) { printAtual = null; msg.textContent = err.message; }
}

      if (saldo != null) DB.lanc.push({ id: uid("l"), aluno: x.aluno, tipo: "saldo", valor: saldo, data: x.data, origem: "comprovante", envio: x.id });
      Object.assign(x, { status: "aprovado", decididoEm: HOJE, valorAprovado: valor }); save();
      const depois = placaDe(estado(a.id).pico), posDepois = copa().findIndex(r => r.a.id === a.id) + 1;
      toast(`Aprovado: ${usd(valor)} para ${a.nome.split(" ")[0]}.` + (depois !== antes ? ` Conquistou o quadro ${depois.nome}!` : "") + (posDepois && posDepois !== posAntes ? ` Agora em ${posDepois}º na Copa.` : ""));
      render(); break;
    }
    case "recusar": {
      const x = DB.envios.find(v => v.id === id), motivo = document.getElementById("ap-mot-" + id).value.trim();
      if (!motivo) { toast("Escreva o motivo da recusa para o aluno saber o que corrigir."); document.getElementById("ap-mot-" + id).focus(); return; }
      Object.assign(x, { status: "recusado", motivo, decididoEm: HOJE }); save(); toast("Comprovante recusado. O aluno vê o motivo em Meus envios."); render(); break;
    }
    case "novo-aluno": state.novoAluno = true; render(); document.getElementById("al-nome")?.focus(); break;
    case "fechar-novo": state.novoAluno = false; render(); break;
    case "editar-aluno": state.editAluno = true; render(); break;
    case "fechar-edicao": state.editAluno = false; render(); break;
    case "abrir-aluno": go("aluno-" + id); break;
    case "ver-como": state.sess = { role: "aluno", id }; salvaSessao(); go("painel"); break;
    case "del-lanc": case "del-copy": {
      if (state.confirmDel !== id) { state.confirmDel = id; return render(); }
      if (b.dataset.act === "del-lanc") DB.lanc = DB.lanc.filter(l => l.id !== id); else DB.copy = DB.copy.filter(c => c.id !== id);
      state.confirmDel = null; save(); toast("Excluído."); render(); break;
    }
    case "sair": state.sess = { role: "login" }; salvaSessao(); render(); break;
    case "entrar": { const v = document.getElementById("lg-perfil").value; state.sess = v === "admin" ? { role: "admin" } : { role: "aluno", id: v }; salvaSessao(); go(v === "admin" ? "admin" : "painel"); break; }
  }
});

load();
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
